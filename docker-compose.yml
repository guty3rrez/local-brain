services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: local-brain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localbrain_secret}
      POSTGRES_DB: ${POSTGRES_DB:-local_brain}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localbrain} -d ${POSTGRES_DB:-local_brain}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: local_brain_pgdata
