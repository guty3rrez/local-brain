[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Local Brain Contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/local-brain/local-brain"
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
# Dependencias compartidas del workspace
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rstest = "0.23"
mockall = "0.13"
async-trait = "0.1"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate"
] }
cucumber = "0.21"
assert_cmd = "2.0"
predicates = "3.1"
pgvector = { version = "0.4", features = ["sqlx"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wiremock = "0.6"
toml = "0.8"
criterion = { version = "0.5", default-features = false, features = ["async_tokio", "tokio"] }
